<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0e14">
<meta name="mobile-web-app-capable" content="yes">
<title>SprintGames</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/icons/favicon-64.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="application-name" content="SprintGames">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SprintGames">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:radial-gradient(circle at 50% 0%,#1a2130,#0b0e14 70%);color:#e6e9ef;font-family:"Segoe UI",system-ui,sans-serif;height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;user-select:none}
#wrap{display:flex;flex-direction:column;gap:10px}
#hud{display:flex;justify-content:space-between;align-items:center;padding:0 6px;gap:16px;min-height:46px}
.pl{display:flex;align-items:center;gap:12px;color:var(--c)}
.name{font-weight:700;font-size:16px;letter-spacing:.5px}
.score{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.dots{display:flex;gap:5px;margin-top:3px}
.dot{width:10px;height:10px;border-radius:50%;background:#262d39;transition:.3s}
.dot.on{background:var(--c);box-shadow:0 0 8px var(--c)}
.mid{text-align:center;font-size:13px;color:#7d8798;line-height:1.5}
.mid b{color:#c9d1dd;font-size:15px}
#stage{position:relative}
canvas{display:block;border-radius:14px;box-shadow:0 18px 60px rgba(0,0,0,.6),0 0 0 1px #232a36}
.overlay{position:absolute;inset:0;border-radius:14px;background:rgba(9,12,18,.87);backdrop-filter:blur(4px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:18px;overflow:auto}
.hidden{display:none}
h1{font-size:38px;font-weight:900;letter-spacing:1px;background:linear-gradient(90deg,#ff6161,#ffd166,#8ee04f,#4fa8ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:#9aa4b4;font-size:14px;max-width:660px;line-height:1.5;min-height:42px}
.games{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.game{font:inherit;width:140px;padding:12px 8px 10px;border-radius:14px;cursor:pointer;color:#aab3c2;background:#141a24;border:2px solid #252d3b;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:14px;font-weight:700;transition:.15s}
.game svg{width:40px;height:40px}
.game:hover{border-color:#4a5568;color:#fff}
.game.sel{border-color:#ffd166;color:#fff;background:#221f15;box-shadow:0 0 20px rgba(255,209,102,.18)}
.modes{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.mode{font:inherit;font-size:14px;font-weight:700;padding:9px 15px;border-radius:11px;cursor:pointer;color:#c9d1dd;background:#161c27;border:2px solid #2a3343;display:flex;align-items:center;gap:6px;transition:.15s}
.mode:hover{border-color:#4a5568}
.mode.sel{border-color:#ffd166;color:#fff;background:#221f15}
.mode svg{width:17px;height:17px}
.cols{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.card{background:#141a24;border:1px solid #252d3b;border-top:3px solid var(--c);border-radius:12px;padding:10px 14px;min-width:190px}
.card h3{font-size:14px;margin-bottom:6px;color:var(--c)}
.row{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:#aab3c2;margin:5px 0;align-items:center}
.card p{font-size:13px;color:#8a94a5;line-height:1.5;max-width:200px}
kbd{display:inline-block;min-width:24px;padding:2px 6px;border-radius:6px;background:#232b38;border:1px solid #36404f;border-bottom-width:3px;color:#e6e9ef;font-family:inherit;font-size:12px;font-weight:600;text-align:center;margin-left:3px}
.pu{display:flex;gap:20px;justify-content:center;flex-wrap:wrap}
.pu div{display:flex;align-items:center;gap:7px;font-size:13px;color:#aab3c2}
.pu svg{width:24px;height:24px}
button.big{font:inherit;font-size:18px;font-weight:700;padding:11px 38px;border:0;border-radius:12px;cursor:pointer;color:#0b0e14;background:linear-gradient(90deg,#ffd166,#ffb347);box-shadow:0 6px 24px rgba(255,190,80,.35);transition:transform .15s}
button.big:hover{transform:translateY(-2px)}
.hint{font-size:12px;color:#6f7a8b}
#winText{font-size:50px;font-weight:900}
.btns{display:flex;gap:12px}
button.ghost{font:inherit;font-size:16px;font-weight:600;padding:11px 26px;border-radius:12px;cursor:pointer;color:#c9d1dd;background:transparent;border:2px solid #36404f}
.onl{display:flex;gap:16px;width:100%;max-width:1060px;align-items:stretch;text-align:left}
.panel{background:#141a24;border:1px solid #252d3b;border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.panel.side{width:330px;flex-shrink:0}
.panel.wide{flex:1;min-width:0}
.ph{font-weight:700;font-size:15px;color:#e6e9ef;display:flex;justify-content:space-between;align-items:center;gap:10px}
.field{display:flex;flex-direction:column;gap:4px;font-size:12px;color:#8a94a5}
input{font:inherit;font-size:14px;padding:8px 10px;border-radius:9px;border:1px solid #36404f;background:#0f141c;color:#e6e9ef;outline:none;width:100%}
input:focus{border-color:#ffd166}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{font:inherit;font-size:13px;font-weight:600;padding:6px 11px;border-radius:8px;border:1px solid #36404f;background:#0f141c;color:#aab3c2;cursor:pointer}
.seg button.sel{border-color:#ffd166;color:#fff;background:#221f15}
.list{display:flex;flex-direction:column;gap:6px;overflow:auto;flex:1;min-height:180px;max-height:330px}
.room{display:flex;align-items:center;gap:12px;padding:11px 14px;background:#0f141c;border:1px solid #252d3b;border-radius:10px;font-size:14px;cursor:pointer;transition:.15s}
.room:hover{border-color:#ffd166;background:#1a1d24;transform:translateX(3px)}
.room.dis{opacity:.5;cursor:default;transform:none;border-color:#252d3b}
.room .go{font-weight:700;color:#ffd166;font-size:13px;display:flex;align-items:center;gap:4px}
.room .go svg{width:14px;height:14px}
.room.dis .go{color:#6f7a8b}
.adv summary{cursor:pointer;font-size:12px;color:#6f7a8b;user-select:none}
.adv summary:hover{color:#aab3c2}
.adv .field{margin-top:8px}
.room .rn{flex:1;font-weight:700;color:#e6e9ef;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.room .rg{color:#8a94a5;font-size:13px;width:84px}
.room .rc{font-variant-numeric:tabular-nums;color:#c9d1dd;width:36px;text-align:center}
.tag{font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;background:#173322;color:#6ee08a;white-space:nowrap}
.tag.busy{background:#3a2a14;color:#ffb347}
button.ghost.sm{font-size:13px;padding:6px 14px;border-radius:9px}
button.ghost:disabled,button.big:disabled{opacity:.4;cursor:default;transform:none}
.empty{color:#6f7a8b;font-size:14px;text-align:center;padding:40px 10px;line-height:1.6}
.joinrow{display:flex;gap:8px}.joinrow input{width:110px;text-transform:uppercase;letter-spacing:2px}
.st{font-size:12px;display:inline-flex;align-items:center;gap:6px;color:#8a94a5;font-weight:500;margin-left:6px}
.st i{width:8px;height:8px;border-radius:50%;background:#ff6161;display:inline-block}.st.on i{background:#6ee08a}
.err{color:#ff8080;font-size:14px;min-height:20px}
.slots{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.slot{width:170px;padding:14px;border-radius:12px;background:#141a24;border:2px solid #252d3b;display:flex;flex-direction:column;align-items:center;gap:6px}
.slot.on{border-color:var(--c)}
.slot .av{width:46px;height:46px;border-radius:50%;background:var(--c);opacity:.2;display:flex;align-items:center;justify-content:center;color:#10131a}
.slot.on .av{opacity:1}
.slot .av svg{width:26px;height:26px}
.slot .nk{font-weight:700;font-size:15px;color:#e6e9ef;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.slot.off .nk{color:#5d6676;font-weight:500}
.slot .rl{font-size:12px;color:#8a94a5;display:flex;gap:4px;align-items:center}
.slot .rl svg{width:14px;height:14px}
.code{font-family:Consolas,monospace;font-size:22px;letter-spacing:4px;color:#ffd166;font-weight:700}
.game.ro{cursor:default}
body{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
canvas{touch-action:none}
.lan{display:flex;gap:14px;align-items:center;text-align:left;font-size:13px;color:#aab3c2;background:#0f141c;border:1px solid #252d3b;border-radius:12px;padding:10px 14px;line-height:1.5}
.lan:empty{display:none}
.lan b{color:#e6e9ef}
.lan .qr{background:#fff;padding:4px;border-radius:8px;line-height:0;flex-shrink:0}
.lan .qr svg{width:100px;height:100px}
.lan .url{font-family:Consolas,monospace;color:#ffd166;font-size:16px;font-weight:700;user-select:all;-webkit-user-select:all}
.lan small{color:#6f7a8b}
#touch{position:fixed;inset:0;pointer-events:none;z-index:6}
#tzL,#tzR{position:absolute;top:0;bottom:0;pointer-events:auto;touch-action:none;-webkit-user-select:none;user-select:none}
#tzL{left:0;width:50%}
#tzR{right:0;width:50%}
#stick{position:absolute;left:0;top:0;width:136px;height:136px;margin:-68px 0 0 -68px;border-radius:50%;background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.2);pointer-events:none;opacity:.45;transition:opacity .15s}
#stick.on{opacity:1;background:rgba(255,255,255,.1)}
#knob{position:absolute;left:50%;top:50%;width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:50%;background:rgba(255,255,255,.4);box-shadow:0 0 14px rgba(0,0,0,.45);pointer-events:none}
#actBtn{position:absolute;right:max(26px,env(safe-area-inset-right));bottom:max(26px,env(safe-area-inset-bottom));width:112px;height:112px;border-radius:50%;background:rgba(255,209,102,.16);border:3px solid rgba(255,209,102,.6);color:#ffd166;font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center;pointer-events:none;user-select:none;-webkit-user-select:none;opacity:.6;transition:transform .08s,opacity .08s}
#actBtn.on{background:rgba(255,209,102,.45);transform:scale(.92);opacity:1}
#tPause{position:absolute;top:max(6px,env(safe-area-inset-top));left:50%;margin-left:-22px;width:44px;height:44px;border-radius:12px;border:1px solid rgba(255,255,255,.22);background:rgba(0,0,0,.45);pointer-events:auto;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:2}
#tPause svg{width:18px;height:18px}
#rotate{display:none}
@media (orientation:portrait) and (pointer:coarse){
  body.playing #rotate{display:flex;position:fixed;inset:0;z-index:20;background:#0b0e14;color:#e6e9ef;flex-direction:column;align-items:center;justify-content:center;gap:16px;font-size:18px;font-weight:600;text-align:center;padding:30px}
  #rotate svg{width:70px;height:70px}
}
@media (max-width:900px),(max-height:560px){
  .overlay{position:fixed;inset:0;border-radius:0;z-index:10;justify-content:flex-start;padding:14px 12px;gap:10px}
  .overlay>*{flex-shrink:0}
  h1{font-size:24px}
  #winText{font-size:30px}
  .sub{font-size:12px;min-height:0}
  .onl{flex-direction:column}
  .panel.side{width:auto}
  .list{max-height:none;min-height:90px}
  .game{width:92px;padding:8px 4px;font-size:12px}.game svg{width:28px;height:28px}
  .mode{padding:7px 10px;font-size:13px}
  .card{min-width:150px;padding:8px 10px}
  .slot{width:130px;padding:10px}
  #hud{min-height:0;gap:8px}
  #hud .mid{display:none}
  .score{font-size:20px}.name{font-size:11px}.dot{width:7px;height:7px}
  .lan .qr svg{width:84px;height:84px}
  body{align-items:flex-start;padding-top:4px}
}
button.dlb{display:inline-flex;align-items:center;gap:8px}
button.dlb svg{width:18px;height:18px}
.modal{position:fixed;inset:0;z-index:40;background:rgba(5,7,11,.75);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:16px}
.modal.hidden{display:none}
.mbox{position:relative;background:#141a24;border:1px solid #2a3343;border-radius:18px;padding:22px 24px;max-width:520px;width:100%;max-height:100%;overflow:auto;text-align:left;font-size:14px;color:#c9d1dd;line-height:1.55;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.mbox p{margin:10px 0}
.mx{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:9px;border:1px solid #36404f;background:transparent;color:#aab3c2;cursor:pointer;display:flex;align-items:center;justify-content:center}
.mx svg{width:16px;height:16px}
.ihead{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.ihead img{width:64px;height:64px;border-radius:16px}
.iname{font-size:22px;font-weight:900;color:#fff}
.isub{font-size:13px;color:#8a94a5}
.steps{margin:8px 0 8px 20px;display:flex;flex-direction:column;gap:8px}
.steps b{color:#fff}
.ii{width:18px;height:18px;vertical-align:-4px;color:#ffd166}
.note{font-size:12px;color:#7d8798}
a.big.apk{display:flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;margin:12px 0;font-size:17px;font-weight:700;padding:13px 20px;border-radius:12px;color:#0b0e14;background:linear-gradient(90deg,#ffd166,#ffb347);box-shadow:0 6px 24px rgba(255,190,80,.3)}
a.big.apk svg{width:20px;height:20px}
</style>
</head>
<body>
<div id="wrap">
  <div id="hud"></div>
  <div id="stage">
    <canvas id="c"></canvas>

    <div class="overlay" id="menu">
      <h1>SPRINTGAMES</h1>
      <div class="games" id="games"></div>
      <p class="sub" id="desc"></p>
      <div class="modes" id="modes"></div>
      <div class="cols" id="cards"></div>
      <div id="extra"></div>
      <div class="btns"><button class="big" id="startBtn">Начать игру</button><button class="ghost" id="onlineBtn">Играть онлайн</button><button class="ghost dlb" id="installBtn">Скачать приложение</button></div>
      <div class="hint">Игра: <kbd>&larr;</kbd><kbd>&rarr;</kbd> &middot; игроки: <kbd>1</kbd>–<kbd>4</kbd> &middot; старт: <kbd>Пробел</kbd> / <kbd>Enter</kbd></div>
    </div>

    <div class="overlay hidden" id="pause">
      <h1 id="pauseTitle">ПАУЗА</h1>
      <div class="btns"><button class="big" id="resumeBtn">Продолжить</button><button class="ghost" id="menuBtn">В меню</button></div>
      <div class="hint"><kbd>Esc</kbd> продолжить</div>
    </div>

    <div class="overlay hidden" id="over">
      <div id="winText">ПОБЕДА</div>
      <div class="sub" id="finalScore"></div>
      <div class="btns"><button class="big" id="againBtn">Играть снова</button><button class="ghost" id="menuBtn2">В меню</button></div>
      <div class="hint" id="overHint">или нажмите <kbd>Пробел</kbd> / <kbd>Enter</kbd></div>
    </div>
    <div class="overlay hidden" id="online">
      <h1>ОНЛАЙН</h1>
      <div class="onl">
        <div class="panel side">
          <div class="field"><label>Ваш ник</label><input id="nick" maxlength="12" autocomplete="off"></div>
          <div class="ph" style="margin-top:6px">Создать свой сервер</div>
          <div class="field"><label>Название</label><input id="roomName" maxlength="24" autocomplete="off"></div>
          <div class="field"><label>Игроков</label><div class="seg" id="maxSeg"></div></div>
          <div class="field"><label>Игра</label><div class="seg" id="gameSeg"></div></div>
          <button class="big" id="createBtn" style="font-size:16px;padding:10px">Создать сервер</button>
          <details class="adv"><summary>Другой адрес сервера</summary><div class="field"><label>Если друг запустил свой сервер — впишите его адрес</label><input id="addr" autocomplete="off" spellcheck="false"></div></details>
        </div>
        <div class="panel wide">
          <div class="ph"><span>Серверы <span class="st" id="netStatus"><i></i>нет соединения</span></span><div class="joinrow"><input id="joinCode" placeholder="КОД" maxlength="4" autocomplete="off"><button class="ghost sm" id="joinBtn">Войти по коду</button></div></div>
          <div class="list" id="roomList"></div>
          <div class="lan" id="lanOnline"></div>
        </div>
      </div>
      <div class="err" id="netErr"></div>
      <button class="ghost" id="onlineBack">Назад</button>
    </div>

    <div class="overlay hidden" id="lobby">
      <h1 id="lobbyName">Сервер</h1>
      <div class="hint">Код сервера (скажите его друзьям): <span class="code" id="lobbyCode"></span></div>
      <div class="lan" id="lanLobby"></div>
      <div class="games" id="lobbyGames"></div>
      <div class="slots" id="slots"></div>
      <p class="sub" id="lobbyHint"></p>
      <div class="hint" id="lobbyWait"></div>
      <div class="btns"><button class="big" id="lobbyStart">Начать игру</button><button class="ghost" id="lobbyLeave">Выйти</button></div>
    </div>
  </div>
</div>

<div id="installBox" class="modal hidden"><div class="mbox"><button class="mx" id="installClose" aria-label="Закрыть"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button><div id="installContent"></div></div></div>
<div id="touch" class="hidden">
  <div id="tzL"></div><div id="tzR"></div>
  <div id="stick"><div id="knob"></div></div>
  <div id="actBtn"><span id="actLbl">Огонь</span></div>
  <div id="tPause"><svg viewBox="0 0 24 24" fill="#e6e9ef"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg></div>
</div>
<div id="rotate"><svg viewBox="0 0 24 24" fill="none" stroke="#ffd166" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="11" rx="2"/><path d="M8 3.5a8 8 0 0 1 9 1.5M17 2v3h-3"/></svg>Поверните телефон горизонтально</div>

<script>
/* =====================================================================
   ОБЩЕЕ
   ===================================================================== */
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=1210,H=730;
const COLORS=['#ff6161','#4fa8ff','#8ee04f','#ff9f43'],DARK=['#a83a3a','#2c6bb0','#4f8f22','#b8641c'];
const PNAMES=['КРАСНЫЙ','СИНИЙ','ЗЕЛЁНЫЙ','ОРАНЖЕВЫЙ'];
const SHIELD='#6ff0e0';
const CTRL=[
  {up:['KeyW'],down:['KeyS'],left:['KeyA'],right:['KeyD'],fire:['Space','KeyF']},
  {up:['ArrowUp'],down:['ArrowDown'],left:['ArrowLeft'],right:['ArrowRight'],fire:['Enter','Slash']},
  {up:['KeyI'],down:['KeyK'],left:['KeyJ'],right:['KeyL'],fire:['KeyU','KeyO']},
  {up:['Numpad8'],down:['Numpad5','Numpad2'],left:['Numpad4'],right:['Numpad6'],fire:['Numpad0','NumpadEnter']}
];
const SOLO={up:['KeyW','ArrowUp'],down:['KeyS','ArrowDown'],left:['KeyA','ArrowLeft'],right:['KeyD','ArrowRight'],fire:['Space','Enter','KeyF']};
const KEYLBL=[
  {up:'W',down:'S',left:'A',right:'D',fire:'Пробел'},
  {up:'↑',down:'↓',left:'←',right:'→',fire:'Enter'},
  {up:'I',down:'K',left:'J',right:'L',fire:'U'},
  {up:'Num 8',down:'Num 5',left:'Num 4',right:'Num 6',fire:'Num 0'}
];
const SOLO_LBL={up:'W/↑',down:'S/↓',left:'A/←',right:'D/→',fire:'Пробел/Enter'};
const rnd=(a,b)=>a+Math.random()*(b-a),ri=n=>Math.floor(Math.random()*n),clamp=(v,a,b)=>v<a?a:v>b?b:v;
const angDiff=(a,b)=>{let d=(a-b)%(Math.PI*2);if(d>Math.PI)d-=Math.PI*2;if(d<-Math.PI)d+=Math.PI*2;return d};
const circle=(x,y,r)=>{ctx.beginPath();ctx.arc(x,y,Math.max(0,r),0,Math.PI*2)};
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,Math.max(0,w),h,r):ctx.rect(x,y,w,h)}

let dpr=1;
function fit(){
  dpr=window.devicePixelRatio||1;
  cv.width=W*dpr;cv.height=H*dpr;
  const hud=document.getElementById('hud'),hh=(hud&&hud.offsetHeight||46)+22,pad=innerWidth<700?8:32;
  const s=Math.min((innerWidth-pad)/W,(innerHeight-hh)/H,1.4);
  cv.style.width=W*s+'px';cv.style.height=H*s+'px';
  document.getElementById('wrap').style.width=W*s+'px';

let state='menu',players=[],round=1,ending=0,freeze=0,banner={text:'',t:0},time=0;

/* =====================================================================
   ИГРА 1: ТАНКИ В ЛАБИРИНТЕ
   ===================================================================== */
const Tanks=(()=>{
const CELL=120,COLS=10,ROWS=6,WT=10,OFF=WT/2;
let walls=[],hG=[],vG=[],bullets=[],powerups=[],puTimer=0,bid=0,mapVer=0,sentVer=-1;
const PU_TYPES=['rapid','shield','triple'];

function genMaze(){
  const h=[],v=[];
  for(let r=0;r<=ROWS;r++)h.push(Array(COLS).fill(1));
  for(let r=0;r<ROWS;r++)v.push(Array(COLS+1).fill(1));
  const seen=Array.from({length:ROWS},()=>Array(COLS).fill(false));
  const st=[[ri(ROWS),ri(COLS)]];seen[st[0][0]][st[0][1]]=true;
  while(st.length){
    const [r,c]=st[st.length-1],nb=[];
    if(r>0&&!seen[r-1][c])nb.push([r-1,c,'u']);
    if(r<ROWS-1&&!seen[r+1][c])nb.push([r+1,c,'d']);
    if(c>0&&!seen[r][c-1])nb.push([r,c-1,'l']);
    if(c<COLS-1&&!seen[r][c+1])nb.push([r,c+1,'r']);
    if(!nb.length){st.pop();continue}
    const [nr,nc,d]=nb[ri(nb.length)];
    if(d==='u')h[r][c]=0;if(d==='d')h[r+1][c]=0;if(d==='l')v[r][c]=0;if(d==='r')v[r][c+1]=0;
    seen[nr][nc]=true;st.push([nr,nc]);
  }
  for(let r=1;r<ROWS;r++)for(let c=0;c<COLS;c++)if(h[r][c]&&Math.random()<.38)h[r][c]=0;
  for(let r=0;r<ROWS;r++)for(let c=1;c<COLS;c++)if(v[r][c]&&Math.random()<.38)v[r][c]=0;
  hG=h;vG=v;walls=[];mapVer++;
  for(let r=0;r<=ROWS;r++){let c=0;while(c<COLS){if(h[r][c]){let e=c;while(e<COLS&&h[r][e])e++;walls.push({x:c*CELL,y:r*CELL,w:(e-c)*CELL+WT,h:WT});c=e}else c++}}
  for(let c=0;c<=COLS;c++){let r=0;while(r<ROWS){if(v[r][c]){let e=r;while(e<ROWS&&v[e][c])e++;walls.push({x:c*CELL,y:r*CELL,w:WT,h:(e-r)*CELL+WT});r=e}else r++}}
}
const cellCenter=(c,r)=>({x:OFF+c*CELL+CELL/2,y:OFF+r*CELL+CELL/2});
const cellOf=(x,y)=>({c:clamp(Math.floor((x-OFF)/CELL),0,COLS-1),r:clamp(Math.floor((y-OFF)/CELL),0,ROWS-1)});
function hitWall(x,y,r){
  for(const w of walls){const cx=clamp(x,w.x,w.x+w.w),cy=clamp(y,w.y,w.y+w.h),dx=x-cx,dy=y-cy;if(dx*dx+dy*dy<r*r)return true}
  return false;
}
function pushOut(t){
  for(const w of walls){
    const cx=clamp(t.x,w.x,w.x+w.w),cy=clamp(t.y,w.y,w.y+w.h),dx=t.x-cx,dy=t.y-cy,d2=dx*dx+dy*dy;
    if(d2>=t.r*t.r)continue;
    if(d2>1e-6){const d=Math.sqrt(d2);t.x+=dx/d*(t.r-d);t.y+=dy/d*(t.r-d)}
    else{const l=t.x-w.x,rr2=w.x+w.w-t.x,u=t.y-w.y,b=w.y+w.h-t.y,m=Math.min(l,rr2,u,b);
      if(m===l)t.x=w.x-t.r;else if(m===rr2)t.x=w.x+w.w+t.r;else if(m===u)t.y=w.y-t.r;else t.y=w.y+w.h+t.r}
  }
}
function bfs(a,b){
  const key=(c,r)=>r*COLS+c,prev=new Map([[key(a.c,a.r),-1]]),q=[a];
  while(q.length){
    const {c,r}=q.shift();
    if(c===b.c&&r===b.r){const path=[];let k=key(c,r);while(k!==-1){path.unshift({c:k%COLS,r:Math.floor(k/COLS)});k=prev.get(k)}return path}
    const nb=[];
    if(r>0&&!hG[r][c])nb.push({c,r:r-1});
    if(r<ROWS-1&&!hG[r+1][c])nb.push({c,r:r+1});
    if(c>0&&!vG[r][c])nb.push({c:c-1,r});
    if(c<COLS-1&&!vG[r][c+1])nb.push({c:c+1,r});
    for(const n of nb){const k=key(n.c,n.r);if(!prev.has(k)){prev.set(k,key(c,r));q.push(n)}}
  }
  return [a];
}

function init(){
  genMaze();bullets=[];powerups=[];puTimer=rnd(4,7);
  const n=players.length;
  const spots=n===2
    ?[[ri(2),ri(ROWS)],[COLS-1-ri(2),ri(ROWS)]]
    :[[ri(2),ri(2)],[COLS-1-ri(2),ROWS-1-ri(2)],[COLS-1-ri(2),ri(2)],[ri(2),ROWS-1-ri(2)]];
  players.forEach((p,k)=>{
    const s=cellCenter(spots[k][0],spots[k][1]);
    const toC=Math.atan2(H/2-s.y,W/2-s.x);
    Object.assign(p,{x:s.x,y:s.y,a:Math.round(toC/(Math.PI/2))*(Math.PI/2),r:17,alive:true,cd:.4,cdMax:0,rapid:0,shield:false,triple:0,tread:0,recoil:0,
      ai:{think:.5+Math.random()*.3,aim:null,path:[],stuck:0,lx:s.x,ly:s.y,rev:0}});
  });
}

function simShot(p,a){
  const dx=Math.cos(a),dy=Math.sin(a);
  for(let d=0;d<=p.r+8;d+=3)if(hitWall(p.x+dx*d,p.y+dy*d,4))return -1;
  let x=p.x+dx*(p.r+8),y=p.y+dy*(p.r+8),vx=dx*4,vy=dy*4;
  for(let k=0;k<280;k++){
    x+=vx;if(hitWall(x,y,4.5)){x-=vx;vx=-vx}
    y+=vy;if(hitWall(x,y,4.5)){y-=vy;vy=-vy}
    const t=k*4/330;
    for(const o of players){
      if(!o.alive)continue;
      if(o.i===p.i&&t<.18)continue;
      const rad=(o.i===p.i?o.r+10:o.r-2)+4.5;
      if((o.x-x)**2+(o.y-y)**2<rad*rad)return o.i;
    }
  }
  return -1;
}
function botLogic(p,dt){
  const ai=p.ai,out={turn:0,mv:0,fire:false};
  const enemies=players.filter(o=>o.alive&&o.i!==p.i);
  if(!enemies.length)return out;
  ai.think-=dt;
  if(ai.think<=0){
    ai.think=rnd(.18,.3);
    let best=null;
    for(let k=0;k<56;k++){
      const a=k/56*Math.PI*2,h=simShot(p,a);
      if(h>=0&&h!==p.i){const d=Math.abs(angDiff(a,p.a));if(!best||d<best.d)best={a,d}}
    }
    ai.aim=best?best.a+rnd(-.03,.03):null;
    const me=cellOf(p.x,p.y);let path=null;
    for(const e of enemies){const pa=bfs(me,cellOf(e.x,e.y));if(!path||pa.length<path.length){path=pa;ai.target=e}}
    for(const u of powerups){const pa=bfs(me,cellOf(u.x,u.y));if(pa.length<=path.length+1){path=pa;ai.target=u}}
    ai.path=path;
  }
  ai.stuck+=dt;
  if(ai.stuck>.8){if(Math.hypot(p.x-ai.lx,p.y-ai.ly)<8)ai.rev=.45;ai.stuck=0;ai.lx=p.x;ai.ly=p.y}
  if(ai.rev>0){ai.rev-=dt;out.mv=-1;out.turn=.8;return out}
  if(ai.aim!==null){
    const d=angDiff(ai.aim,p.a);
    out.turn=clamp(d*5,-1,1);
    if(Math.abs(d)<.045&&p.cd<=0){out.fire=true;ai.aim=null;ai.think=Math.min(ai.think,.12)}
    return out;
  }
  const path=ai.path||[];
  let tx,ty;
  if(path.length>1){const c=cellCenter(path[1].c,path[1].r);tx=c.x;ty=c.y}
  else if(ai.target){tx=ai.target.x;ty=ai.target.y}
  else return out;
  const d=angDiff(Math.atan2(ty-p.y,tx-p.x),p.a);
  out.turn=clamp(d*4,-1,1);
  out.mv=Math.abs(d)<.5?1:0;
  if(ai.target&&ai.target.i!==undefined&&path.length<=1&&Math.hypot(ai.target.x-p.x,ai.target.y-p.y)<90)out.mv=0;
  return out;
}
function bot(p,dt){const o=botLogic(p,dt);return{x:o.turn,y:-o.mv,act:o.fire}}

function fire(p){
  const own=bullets.filter(b=>b.owner===p.i).length,max=p.rapid>0?12:5;
  if(own>=max)return;
  const spread=p.triple>0?[-.2,0,.2]:[0];if(p.triple>0)p.triple--;
  let fired=false;
  for(const s of spread){
    const a=p.a+s,dx=Math.cos(a),dy=Math.sin(a);
    let blocked=false;for(let d=0;d<=p.r+8;d+=3)if(hitWall(p.x+dx*d,p.y+dy*d,4)){blocked=true;break}
    const tx=p.x+dx*(p.r+8),ty=p.y+dy*(p.r+8);
    if(blocked){spark(tx,ty,COLORS[p.i],6);continue}
    bullets.push({id:++bid,x:tx,y:ty,vx:dx*330,vy:dy*330,owner:p.i,life:6,safe:.18,r:4.5,trail:[]});fired=true;
  }
  p.cdMax=p.cd=p.rapid>0?.2:.7;p.recoil=1;
  if(fired)beep(380+p.i*70,.09,'square',.035,-200);
}
function kill(p){p.alive=false;explode(p.x,p.y,COLORS[p.i]);checkLast()}
function spawnPowerup(){
  if(powerups.length>=(players.length>2?3:2))return;
  for(let tries=0;tries<30;tries++){
    const c=ri(COLS),r=ri(ROWS),p=cellCenter(c,r);
    if(players.some(pl=>pl.alive&&Math.hypot(pl.x-p.x,pl.y-p.y)<170))continue;
    if(powerups.some(u=>u.x===p.x&&u.y===p.y))continue;
    powerups.push({x:p.x,y:p.y,type:PU_TYPES[ri(3)],life:13,born:time});return;
  }
}
function update(dt){
  for(const p of players){
    if(!p.alive)continue;
    p.cd-=dt;p.rapid=Math.max(0,p.rapid-dt);p.recoil=Math.max(0,p.recoil-dt*6);
    const inp=input(p,dt);let turn=inp.x,mv=-inp.y;
    if(inp.abs){
      const m=Math.min(1,Math.hypot(inp.x,inp.y));
      if(m>.05){const d=angDiff(Math.atan2(inp.y,inp.x),p.a);turn=clamp(d*4,-1,1);mv=Math.abs(d)<.7?m:Math.abs(d)<1.2?m*.35:0}
      else{turn=0;mv=0}
    }
    if(mv<0)mv*=.65;
    p.a+=turn*3.3*dt;
    if(mv){p.x+=Math.cos(p.a)*mv*165*dt;p.y+=Math.sin(p.a)*mv*165*dt;p.tread+=mv*dt*30}
    if(turn)p.tread+=dt*15;
    pushOut(p);
    if(inp.act&&p.cd<=0)fire(p);
  }
  for(let i=0;i<players.length;i++)for(let j=i+1;j<players.length;j++){
    const a=players[i],b=players[j];if(!a.alive||!b.alive)continue;
    const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy),m=a.r+b.r;
    if(d<m&&d>0){const o=(m-d)/2;a.x-=dx/d*o;a.y-=dy/d*o;b.x+=dx/d*o;b.y+=dy/d*o;pushOut(a);pushOut(b)}
  }
  for(const bl of bullets){
    bl.life-=dt;bl.safe-=dt;
    const steps=Math.ceil(Math.hypot(bl.vx,bl.vy)*dt/3),s=dt/steps;
    for(let k=0;k<steps;k++){
      bl.x+=bl.vx*s;if(hitWall(bl.x,bl.y,bl.r)){bl.x-=bl.vx*s;bl.vx=-bl.vx;beep(900,.03,'triangle',.015)}
      bl.y+=bl.vy*s;if(hitWall(bl.x,bl.y,bl.r)){bl.y-=bl.vy*s;bl.vy=-bl.vy;beep(900,.03,'triangle',.015)}
    }
    bl.trail.push(bl.x,bl.y);if(bl.trail.length>16)bl.trail.splice(0,2);
    for(const p of players){
      if(!p.alive||bl.life<=0)continue;
      if(bl.owner===p.i&&bl.safe>0)continue;
      if(Math.hypot(p.x-bl.x,p.y-bl.y)<p.r+bl.r){
        bl.life=0;
        if(p.shield){p.shield=false;spark(bl.x,bl.y,SHIELD,18);shake=6;beep(300,.2,'sine',.06,300)}
        else kill(p);
      }
    }
    if(bl.life<=0)spark(bl.x,bl.y,COLORS[bl.owner],4);
  }
  bullets=bullets.filter(b=>b.life>0);
  puTimer-=dt;if(puTimer<=0){spawnPowerup();puTimer=rnd(6,10)}
  for(const u of powerups){
    u.life-=dt;
    for(const p of players){
      if(!p.alive||u.life<=0)continue;
      if(Math.hypot(p.x-u.x,p.y-u.y)<p.r+15){
        u.life=0;
        if(u.type==='rapid')p.rapid=6;else if(u.type==='shield')p.shield=true;else p.triple=3;
        spark(u.x,u.y,'#ffd166',16);beep(660,.08,'sine',.05);setTimeout(()=>beep(990,.12,'sine',.05),70);
      }
    }
  }
  powerups=powerups.filter(u=>u.life>0);
}

function drawTank(p){
  ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);
  ctx.fillStyle='rgba(0,0,0,.35)';rr(-17,-15,36,32,7);ctx.fill();
  ctx.fillStyle='#1b2029';rr(-18,-17,36,9,3);ctx.fill();rr(-18,8,36,9,3);ctx.fill();
  ctx.strokeStyle='#3a4250';ctx.lineWidth=2;
  const off=((p.tread%6)+6)%6;
  for(let x=-18+off;x<18;x+=6){ctx.beginPath();ctx.moveTo(x,-16);ctx.lineTo(x,-9);ctx.moveTo(x,9);ctx.lineTo(x,16);ctx.stroke()}
  ctx.fillStyle=DARK[p.i];rr(-15,-11,30,22,5);ctx.fill();
  ctx.fillStyle=COLORS[p.i];rr(-14,-10,28,18,5);ctx.fill();
  const rec=p.recoil*4;
  ctx.fillStyle='#d9dee6';rr(2-rec,-3.5,22,7,2);ctx.fill();
  ctx.fillStyle='#8b94a3';ctx.fillRect(20-rec,-4,5,8);
  ctx.fillStyle=DARK[p.i];circle(0,0,8.5);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.25)';circle(-2,-2,4);ctx.fill();

const Sumo=(()=>{
const CX=W/2,CY=H/2,R0=330,RMIN=110,PR=24;
let R=R0,el=0;
function init(){
  R=R0;el=0;const n=players.length;
  players.forEach((p,k)=>{
    const a=(n===2?Math.PI:-3*Math.PI/4)+k*(Math.PI*2/n);
    Object.assign(p,{x:CX+Math.cos(a)*190,y:CY+Math.sin(a)*190,vx:0,vy:0,fx:-Math.cos(a),fy:-Math.sin(a),alive:true,fall:0,cd:.5,cdMax:1.3,dash:0,ai:{t:0}});
  });
}
function update(dt){
  el+=dt;if(el>3)R=Math.max(RMIN,R0-(el-3)*10);
  for(const p of players){
    if(!p.alive)continue;
    if(p.fall>0){
      p.fall+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.97;p.vy*=.97;
      if(p.fall>.7){p.alive=false;shake=8;spark(p.x,p.y,COLORS[p.i],14);checkLast()}
      continue;
    }
    const inp=input(p,dt);let ax=inp.x,ay=inp.y;const l=Math.hypot(ax,ay);
    if(l>.1){ax/=l;ay/=l;p.fx=ax;p.fy=ay;if(p.vx*ax+p.vy*ay<250){p.vx+=ax*1300*dt;p.vy+=ay*1300*dt}}
    const damp=Math.exp(-2.8*dt);p.vx*=damp;p.vy*=damp;
    p.cd-=dt;p.dash-=dt;
    if(inp.act&&p.cd<=0){p.vx+=p.fx*480;p.vy+=p.fy*480;p.dash=.3;p.cd=p.cdMax;beep(250,.12,'sawtooth',.04,200);spark(p.x-p.fx*PR,p.y-p.fy*PR,'#cfd6e0',8)}
    p.x+=p.vx*dt;p.y+=p.vy*dt;
    if(Math.hypot(p.x-CX,p.y-CY)>R){p.fall=.001;beep(500,.45,'sine',.05,-420)}
  }
  for(let i=0;i<players.length;i++)for(let j=i+1;j<players.length;j++){
    const a=players[i],b=players[j];
    if(!a.alive||!b.alive||a.fall>0||b.fall>0)continue;
    const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy);
    if(d>=PR*2||d===0)continue;
    const nx=dx/d,ny=dy/d,o=(PR*2-d)/2;
    a.x-=nx*o;a.y-=ny*o;b.x+=nx*o;b.y+=ny*o;
    const vr=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;
    if(vr<0){
      const ma=a.dash>0?2.5:1,mb=b.dash>0?2.5:1,j2=-(2.1)*vr/(1/ma+1/mb);
      a.vx-=j2/ma*nx;a.vy-=j2/ma*ny;b.vx+=j2/mb*nx;b.vy+=j2/mb*ny;
      const s=Math.min(1,-vr/600);shake=Math.max(shake,s*10);
      beep(150+s*200,.08,'square',.03+s*.04);spark((a.x+b.x)/2,(a.y+b.y)/2,'#fff',4+(s*10|0));
    }
  }
}
function bot(p,dt){
  const enemies=players.filter(o=>o.alive&&o.i!==p.i&&!(o.fall>0));
  if(!enemies.length){const cx=CX-p.x,cy=CY-p.y,cl=Math.hypot(cx,cy);return cl<20?{x:0,y:0,act:false}:{x:cx/cl,y:cy/cl,act:false}}
  let e=enemies[0];for(const o of enemies)if(Math.hypot(o.x-p.x,o.y-p.y)<Math.hypot(e.x-p.x,e.y-p.y))e=o;
  const dc=Math.hypot(p.x-CX,p.y-CY);
  let tx,ty;
  if(dc>R-75){tx=CX;ty=CY}
  else{const ex=e.x-CX,ey=e.y-CY,el2=Math.hypot(ex,ey)||1;tx=e.x-ex/el2*35;ty=e.y-ey/el2*35}
  let x=tx-p.x,y=ty-p.y;const l=Math.hypot(x,y)||1;x/=l;y/=l;
  const ed=Math.hypot(e.x-p.x,e.y-p.y),dot=(p.fx*(e.x-p.x)+p.fy*(e.y-p.y))/(ed||1);
  const ec=Math.hypot(e.x-CX,e.y-CY);
  p.ai.t-=dt;
  let act=false;
  const land=Math.hypot(p.x+p.fx*150-CX,p.y+p.fy*150-CY);
  if(p.ai.t<=0&&ed<160&&dot>.85&&ec>dc-30&&p.cd<=0&&(land<R-25||ed<70)){act=true;p.ai.t=rnd(.1,.4)}
  if(dc<R-75&&ed<160){x=(e.x-p.x)/ed;y=(e.y-p.y)/ed}
  return{x,y,act};
}
function draw(){
  ctx.fillStyle='#0b0e16';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(255,255,255,.04)';
  for(let k=0;k<60;k++){const sx=(k*197)%W,sy=(k*313)%H;ctx.fillRect(sx,sy,2,2)}

  ctx.lineWidth=2;ctx.strokeStyle='rgba(255,255,255,.07)';circle(CX,CY,R*.55);ctx.stroke();circle(CX,CY,22);ctx.stroke();
  const order=players.filter(p=>p.alive).sort((a,b)=>(b.fall>0)-(a.fall>0));

return{
  title:'Сумо',win:5,snap:()=>({R:q(R)}),load:o=>{R=o.R},pf:['x','y','fx','fy','fall','dash','cd','cdMax','alive'],
  desc:'Выталкивайте соперников с платформы, которая постепенно сжимается. Рывок бьёт сильнее обычного толчка. Последний на арене побеждает.',
  rows:[['Движение',['up','left','down','right']],['Рывок',['fire']]],
  botText:'Заходит со стороны центра и толкает к краю.',
  icon:'<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="17" fill="#1d2433" stroke="#ffd166" stroke-width="2.5"/><circle cx="14" cy="21" r="6" fill="#ff6161"/><circle cx="26" cy="19" r="6" fill="#4fa8ff"/><circle cx="16" cy="20" r="1.6" fill="#fff"/><circle cx="24" cy="18" r="1.6" fill="#fff"/></svg>',

const Trails=(()=>{
const GS=4,GW=Math.ceil(W/GS),GH=Math.ceil(H/GS),SP=135,TURN=2.9;
let grid,stamp,tcv,tctx,t=0,segs=[];
const idx=(x,y)=>{const cx=x/GS|0,cy=y/GS|0;return(cx<0||cy<0||cx>=GW||cy>=GH)?-1:cy*GW+cx};
function init(){
  grid=new Int8Array(GW*GH);stamp=new Float32Array(GW*GH);t=0;segs=[];
  tcv=document.createElement('canvas');tcv.width=W*dpr;tcv.height=H*dpr;
  tctx=tcv.getContext('2d');tctx.setTransform(dpr,0,0,dpr,0,0);tctx.lineCap='round';tctx.lineWidth=5;
  const pos=[];
  players.forEach(p=>{
    let x,y;for(let k=0;k<60;k++){x=rnd(190,W-190);y=rnd(160,H-160);if(pos.every(q=>Math.hypot(q.x-x,q.y-y)>230))break}
    pos.push({x,y});
    Object.assign(p,{x,y,a:Math.atan2(H/2-y,W/2-x)+rnd(-.8,.8),alive:true,jump:0,cd:1,cdMax:4,gap:0,nextGap:rnd(1.5,3),ai:{t:0,turn:0,act:false}});
  });
}
function mark(x0,y0,x1,y1,i){
  const n=Math.max(1,Math.ceil(Math.hypot(x1-x0,y1-y0)/2));
  for(let k=1;k<=n;k++){
    const x=x0+(x1-x0)*k/n,y=y0+(y1-y0)*k/n;
    for(const ox of[-2,2])for(const oy of[-2,2]){const c=idx(x+ox,y+oy);if(c>=0){grid[c]=i+1;stamp[c]=t}}
  }
}
const outside=(x,y)=>x<6||y<6||x>W-6||y>H-6;
function blocked(x,y,i){
  if(outside(x,y))return true;
  const c=idx(x,y);return grid[c]>0&&(grid[c]-1!==i||t-stamp[c]>.4);
}
function update(dt){
  t+=dt;
  for(const p of players){
    if(!p.alive)continue;
    const inp=input(p,dt);
    let tn=clamp(inp.x,-1,1);
    if(inp.abs)tn=Math.hypot(inp.x,inp.y)>.05?clamp(angDiff(Math.atan2(inp.y,inp.x),p.a)*3,-1,1):0;
    p.a+=tn*TURN*dt;
    p.cd-=dt;p.jump-=dt;p.gap-=dt;p.nextGap-=dt;
    if(p.nextGap<=0){p.gap=.2;p.nextGap=rnd(2,3.5)}
    if(inp.act&&p.cd<=0&&p.jump<=0){p.jump=.45;p.cd=p.cdMax;beep(600,.15,'sine',.04,300)}
    const nx=p.x+Math.cos(p.a)*SP*dt,ny=p.y+Math.sin(p.a)*SP*dt;
    const hx=nx+Math.cos(p.a)*4,hy=ny+Math.sin(p.a)*4;
    if(outside(hx,hy)||(p.jump<=0&&blocked(hx,hy,p.i))){p.alive=false;explode(p.x,p.y,COLORS[p.i]);checkLast();continue}
    if(p.jump<=0&&p.gap<=0){
      mark(p.x,p.y,nx,ny,p.i);
      if(Net.inGame)segs.push([q(p.x),q(p.y),q(nx),q(ny),p.i]);tctx.strokeStyle=COLORS[p.i];tctx.beginPath();tctx.moveTo(p.x,p.y);tctx.lineTo(nx,ny);tctx.stroke();
    }
    p.x=nx;p.y=ny;
  }
}
function free(p,turn){
  let x=p.x,y=p.y,a=p.a;
  for(let k=1;k<=55;k++){
    if(k<=30)a+=turn*TURN*(4/SP);
    x+=Math.cos(a)*4;y+=Math.sin(a)*4;
    if(blocked(x,y,p.i))return k;
  }
  return 56;
}
function bot(p,dt){
  const ai=p.ai;ai.t-=dt;
  if(ai.t<=0){
    ai.t=.07;const opts=[-1,-.5,0,.5,1];
    const s=opts.map(o=>free(p,o)+(o===0?3:0)+rnd(0,2));
    const m=Math.max(...s);ai.turn=opts[s.indexOf(m)];
    ai.act=free(p,ai.turn)<9&&p.cd<=0;
  }
  return{x:ai.turn,y:0,act:ai.act};
}
function draw(){
  ctx.fillStyle='#0a0d15';ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(120,140,180,.06)';ctx.lineWidth=1;ctx.beginPath();
  for(let x=0;x<=W;x+=40){ctx.moveTo(x+.5,0);ctx.lineTo(x+.5,H)}
  for(let y=0;y<=H;y+=40){ctx.moveTo(0,y+.5);ctx.lineTo(W,y+.5)}
  ctx.stroke();
  ctx.strokeStyle='#3a4457';ctx.lineWidth=6;ctx.strokeRect(3,3,W-6,H-6);
  ctx.shadowBlur=8;ctx.shadowColor='rgba(255,255,255,.25)';ctx.drawImage(tcv,0,0,W,H);ctx.shadowBlur=0;
  for(const p of players){
    if(!p.alive)continue;
    const r=p.jump>0?9:5.5;
    if(p.jump>0){ctx.fillStyle='rgba(0,0,0,.4)';circle(p.x+5,p.y+8,6);ctx.fill()}
    ctx.shadowColor=COLORS[p.i];ctx.shadowBlur=16;ctx.fillStyle=COLORS[p.i];circle(p.x,p.y,r);ctx.fill();ctx.shadowBlur=0;
    ctx.fillStyle='#fff';circle(p.x,p.y,r*.45);ctx.fill();
    if(freeze>0||state==='menu'){
      ctx.strokeStyle=COLORS[p.i];ctx.lineWidth=2;ctx.setLineDash([5,5]);ctx.beginPath();
      ctx.moveTo(p.x+Math.cos(p.a)*12,p.y+Math.sin(p.a)*12);ctx.lineTo(p.x+Math.cos(p.a)*48,p.y+Math.sin(p.a)*48);ctx.stroke();ctx.setLineDash([]);
    }
    drawCd(p,12);drawLabel(p,19);
  }
}
return{

  desc:'Каждый оставляет за собой светящийся след. Врезался в след или в стену — выбыл. Прыжок позволяет перескочить через линию. Последний выживший побеждает.',

function freeSpot(x,y,r){return x>30&&y>30&&x<W-30&&y<H-30&&pillars.every(c=>Math.hypot(c.x-x,c.y-y)>c.r+r)}
function spawnGem(){
  for(let k=0;k<40;k++){
    const x=rnd(40,W-40),y=rnd(40,H-40);

function collide(o,r,bounce){

  if(o.x>W-r-8){o.x=W-r-8;o.vx=-Math.abs(o.vx)*bounce}
  if(o.y<r+8){o.y=r+8;o.vy=Math.abs(o.vy)*bounce}

}
function update(dt){
  if(over)return;

  if(left<=5&&Math.ceil(left)<lastBeep){lastBeep=Math.ceil(left);beep(880,.08,'square',.04)}
  if(left<=0){left=0;over=true;beep(300,.6,'square',.05,-100);startEnding(2.4);return}
  spawnT-=dt;if(spawnT<=0){spawnT=.7;if(gems.length<8+players.length*2)spawnGem()}
  for(const p of players){
    if(!p.alive)continue;
    p.stun-=dt;p.inv-=dt;p.cd-=dt;p.dash-=dt;
    const inp=p.stun>0?{x:0,y:0,act:false}:input(p,dt);
    let ax=inp.x,ay=inp.y;const l=Math.hypot(ax,ay);
    if(l>.1){ax/=l;ay/=l;p.fx=ax;p.fy=ay}else{ax=0;ay=0}
    if(p.dash<=0){const k=Math.min(1,dt*(p.stun>0?3:9));p.vx+=(ax*240-p.vx)*k;p.vy+=(ay*240-p.vy)*k}
    if(inp.act&&p.cd<=0){p.dash=.2;p.cd=p.cdMax;p.vx=p.fx*640;p.vy=p.fy*640;beep(330,.1,'sawtooth',.035,250)}
    p.x+=p.vx*dt;p.y+=p.vy*dt;collide(p,PR,.4);
  }
  for(let i=0;i<players.length;i++)for(let j=i+1;j<players.length;j++){
    const a=players[i],b=players[j],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy);
    if(d>=PR*2||d===0||!a.alive||!b.alive)continue;
    const o=(PR*2-d)/2;a.x-=dx/d*o;a.y-=dy/d*o;b.x+=dx/d*o;b.y+=dy/d*o;
    if(a.dash>0&&b.inv<=0)hit(a,b);else if(b.dash>0&&a.inv<=0)hit(b,a);
  }
  for(const g of gems){
    g.lock-=dt;
    if(g.vx||g.vy){g.x+=g.vx*dt;g.y+=g.vy*dt;const dmp=Math.exp(-3*dt);g.vx*=dmp;g.vy*=dmp;collide(g,8,.6);if(Math.hypot(g.vx,g.vy)<5){g.vx=0;g.vy=0}}
    if(g.lock>0)continue;
    for(const p of players){
      if(!p.alive)continue;
      if(Math.hypot(p.x-g.x,p.y-g.y)<PR+12){
        const val=g.v;p.gems+=val;g.v=0;
        beep(700+Math.min(p.gems,25)*25,.07,'sine',.05);spark(g.x,g.y,val===3?'#ffd166':SHIELD,6);
        break;

}

function bot(p,dt){
  const ai=p.ai;ai.t-=dt;

    ai.t=.15;let best=null,bs=0;

      const myD=Math.hypot(g.x-p.x,g.y-p.y);
      const rival=Math.min(...players.filter(o=>o!==p&&o.alive).map(o=>Math.hypot(g.x-o.x,g.y-o.y)));
      const s=g.v/(myD+30)*(rival<myD*.6?.5:1)*(g.lock>0?.7:1);
      if(s>bs){bs=s;best=g}
    }
    ai.g=best;
  }
  let tx=W/2,ty=H/2;if(ai.g){tx=ai.g.x;ty=ai.g.y}
  let dx=tx-p.x,dy=ty-p.y;const l=Math.hypot(dx,dy)||1;dx/=l;dy/=l;
  let act=false;
  for(const e of players){
    if(e===p||!e.alive||e.inv>0||e.gems<2)continue;
    const ex=e.x-p.x,ey=e.y-p.y,ed=Math.hypot(ex,ey);
    if(ed<130){dx=ex/ed;dy=ey/ed;if(p.cd<=0&&(p.fx*dx+p.fy*dy)>.85)act=true;break}
  }
  for(const c of pillars){
    const ox=p.x-c.x,oy=p.y-c.y,d=Math.hypot(ox,oy),lim=c.r+PR+45;
    if(d<lim){const w=(lim-d)/45,tx2=-oy/d,ty2=ox/d,s=Math.sign(tx2*dx+ty2*dy)||1;dx+=(ox/d*.6+tx2*s)*w*1.5;dy+=(oy/d*.6+ty2*s)*w*1.5}

}

  if(ips.some(ip=>!ip.startsWith('10.')))ips=ips.filter(ip=>!ip.startsWith('10.')); // 10.x — обычно мобильный интернет
  ips.sort((a,b)=>b.startsWith('192.168.')-a.startsWith('192.168.'));
  const cands=[],seen=new Set(),add=c=>{if(!seen.has(c)){seen.add(c);cands.push(c)}};
  add('192.168.137.1:3000'); // точка доступа Windows
  for(const ip of ips)add(ip.split('.').slice(0,3).join('.')+'.1:3000');
  for(const ip of ips){const b=ip.split('.').slice(0,3).join('.');for(let i=2;i<255;i++)if(`${b}.${i}`!==ip)add(`${b}.${i}:3000`)}
  const probe=c=>new Promise((res,rej)=>{
    const ac=new AbortController(),t=setTimeout(()=>ac.abort(),1500);
    fetch(`http://${c}/info`,{signal:ac.signal,cache:'no-store'}).then(r=>r.json())
      .then(j=>{clearTimeout(t);j&&j.app==='sprintgames'?res(c):rej()}).catch(()=>{clearTimeout(t);rej()});
  });
  finding=(async()=>{
    for(let i=0;i<cands.length;i+=48){try{return await Promise.any(cands.slice(i,i+48).map(probe))}catch{}}
    return null;
  })().finally(()=>{finding=null});

function onNet(m){
  switch(m.t){
    case 'list':if(state==='online')renderRooms(m.rooms);break;
    case 'err':showErr(m.msg);break;
    case 'joined':Net.online=true;Net.host=!!m.host;Net.pid=m.pid;Net.inputs={};Net.room=null;Net.inGame=false;setState('lobby');break;
    case 'room':Net.room=m.room;if(state==='lobby'){renderLobby();lobbyPreview()}break;
    case 'closed':Net.online=Net.inGame=Net.host=false;Net.room=null;setState('online');showErr('Хост закрыл сервер');break;
    case 'left':onPeerLeft(m.pid);break;
    case 'relay':if(m.d&&typeof m.d==='object'){Net.host?onHostMsg(m.from,m.d):onGuestMsg(m.d)}break;
  }
}

  gi=r.game;G=GAMES[gi];

/* ---------- гость ---------- */
function onGuestMsg(d){
  if(d.k==='start'){
    if(!Array.isArray(d.players))return;
    gi=clamp(d.game|0,0,GAMES.length-1);G=GAMES[gi];
    players=d.players.map(p=>({i:clamp(p.i|0,0,3),name:String(p.name).slice(0,12),score:0,alive:true,x:0,y:0,bot:false,remote:0}));
    round=0;particles=[];ending=0;buildHud();G.init();setState('play');
  }else if(d.k==='s'){
    if(state==='play'||state==='pause')applySnap(d);
  }else if(d.k==='over'){
    if(Array.isArray(d.sc))players.forEach((p,j)=>p.score=d.sc[j]|0);
    updateHud();
    const c=players[d.w|0];
    if(c){const t=$('winText');t.textContent='ПОБЕДИЛ '+c.name.toUpperCase()+'!';t.style.color=COLORS[c.i]}
    $('finalScore').innerHTML=finalHtml();
    setState('over');
  }else if(d.k==='lobby'){
    setState('lobby');
  }
}
function applySnap(s){
  if(s.r!==round){round=s.r;particles=[];G.init();updateHud()}
  ending=s.e;freeze=s.f;banner={text:String(s.b[0]),t:s.b[1]};shake=s.sh;
  let ch=false;
  s.sc.forEach((v,k)=>{if(players[k]&&players[k].score!==v){players[k].score=v;ch=true}});
  if(ch)updateHud();
  s.P.forEach((arr,k)=>{const p=players[k];if(p)G.pf.forEach((f,j)=>p[f]=arr[j])});
  G.load(s.g);
  for(const e of s.fx){
    if(e[0]==='b')beep(e[1],e[2],e[3],e[4],e[5]);
    else if(e[0]==='s')spark(e[1],e[2],e[3],e[4]);
    else if(e[0]==='e')explode(e[1],e[2],e[3]);
  }
}
function guestTick(dt){
  time+=dt;shake=Math.max(0,shake-dt*40);if(banner.t>0)banner.t-=dt;
  for(const pt of particles){pt.life-=dt;pt.x+=pt.vx*dt;pt.y+=pt.vy*dt;pt.vx*=.93;pt.vy*=.93}
  particles=particles.filter(p=>p.life>0);
}

const isTouch=matchMedia('(pointer:coarse)').matches;
const touch={on:isTouch,x:0,y:0,act:false};
// abs:true — джойстик задаёт направление «куда ехать», а не «вперёд/поворот»
function readCtrl(c){
  let x=(held(c.right)?1:0)-(held(c.left)?1:0),y=(held(c.down)?1:0)-(held(c.up)?1:0),act=held(c.fire),abs=false;
  if(touch.on&&(c===SOLO||c===CTRL[0])){
    if(!x&&!y&&(touch.x||touch.y)){x=touch.x;y=touch.y;abs=true}
    act=act||touch.act;
  }
  return{x,y,act,abs};
}
function updTouch(){

(function(){
  const L=$('tzL'),Rz=$('tzR'),st=$('stick'),kn=$('knob'),ab=$('actBtn'),RAD=58;
  let sid=null,aid=null,cx=0,cy=0;
  const place=()=>{st.style.left=cx+'px';st.style.top=cy+'px'};
  const home=()=>{cx=Math.max(96,innerWidth*.13);cy=innerHeight-Math.max(96,innerHeight*.27);place();kn.style.transform='';st.classList.remove('on')};
  home();addEventListener('resize',()=>{if(sid===null)home()});
  const move=e=>{
    let dx=e.clientX-cx,dy=e.clientY-cy;const d=Math.hypot(dx,dy);
    // если палец ушёл далеко — джойстик «едет» за ним, чтобы не упираться в край
    if(d>RAD*1.6){const k=(d-RAD*1.6)/d;cx+=dx*k;cy+=dy*k;place();dx=e.clientX-cx;dy=e.clientY-cy}
    const dd=Math.hypot(dx,dy),kx=dd>RAD?dx/dd*RAD:dx,ky=dd>RAD?dy/dd*RAD:dy;
    kn.style.transform=`translate(${kx}px,${ky}px)`;
    let m=Math.min(1,dd/RAD);m=m<.18?0:Math.min(1,(m-.18)/.62);
    const an=Math.atan2(dy,dx);touch.x=m?Math.cos(an)*m:0;touch.y=m?Math.sin(an)*m:0;
  };
  L.addEventListener('pointerdown',e=>{
    if(sid!==null)return;sid=e.pointerId;try{L.setPointerCapture(sid)}catch{}
    cx=e.clientX;cy=e.clientY;place();st.classList.add('on');move(e);e.preventDefault();
  });
  L.addEventListener('pointermove',e=>{if(e.pointerId===sid){move(e);e.preventDefault()}});
  const endL=e=>{if(e.pointerId!==sid)return;sid=null;touch.x=touch.y=0;home()};
  L.addEventListener('pointerup',endL);L.addEventListener('pointercancel',endL);L.addEventListener('lostpointercapture',endL);
  Rz.addEventListener('pointerdown',e=>{
    if(aid!==null)return;aid=e.pointerId;try{Rz.setPointerCapture(aid)}catch{}
    touch.act=true;ab.classList.add('on');if(window.SprintApp&&SprintApp.vibrate)SprintApp.vibrate(14);else if(navigator.vibrate)navigator.vibrate(12);e.preventDefault();
  });
  const endR=e=>{if(e.pointerId!==aid)return;aid=null;touch.act=false;ab.classList.remove('on')};
  Rz.addEventListener('pointerup',endR);Rz.addEventListener('pointercancel',endR);Rz.addEventListener('lostpointercapture',endR);
  touch.reset=()=>{sid=aid=null;touch.x=touch.y=0;touch.act=false;ab.classList.remove('on');home()};
  $('tPause').onclick=()=>{if(state==='play')setState('pause')};
  addEventListener('contextmenu',e=>{if(isTouch)e.preventDefault()});
})();

/* =====================================================================

   ===================================================================== */
const QR=(()=>{

    for(const d of data){const f=d^res[0];res.shift();res.push(0);for(let j=0;j<n;j++)res[j]^=mul(g[j+1],f)}

    put(4,4);put(bytes.length,8);for(const b of bytes)put(b,8);

    for(let pad=0xEC;data.length<DATA[v];pad^=0xEC^0x11)data.push(pad);
    const all=data.concat(ecc(data,ECC[v]));
    const size=17+4*v,m=[],fn=[];
    for(let y=0;y<size;y++){m.push(new Array(size).fill(false));fn.push(new Array(size).fill(false))}
    const set=(x,y,d)=>{m[y][x]=d;fn[y][x]=true};

    const penalty=()=>{
      let p=0;const lines=[];
      for(let y=0;y<size;y++){lines.push(m[y].map(b=>b?1:0).join(''));lines.push(m.map(r=>r[y]?1:0).join(''))}
      for(const l of lines){
        for(const run of l.match(/0{5,}|1{5,}/g)||[])p+=run.length-2;
        for(const pat of['10111010000','00001011101']){let i=l.indexOf(pat);while(i>=0){p+=40;i=l.indexOf(pat,i+1)}}
      }
      for(let y=0;y<size-1;y++)for(let x=0;x<size-1;x++){const c=m[y][x];if(c===m[y][x+1]&&c===m[y+1][x]&&c===m[y+1][x+1])p+=3}
      let dark=0;for(const r of m)for(const b of r)if(b)dark++;
      p+=10*Math.floor(Math.abs(dark*100/(size*size)-50)/5);
      return p;
    };
    let best=forceMask??-1;
    if(best<0){let bp=Infinity;for(let mk=0;mk<8;mk++){apply(mk);fmt(mk);const p=penalty();if(p<bp){bp=p;best=mk}apply(mk)}}
    apply(best);fmt(best);
    return m;
  }
  function svg(text){
    const m=matrix(text);if(!m)return'';
    const n=m.length,q=4;let d='';
    for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(m[y][x])d+=`M${x+q} ${y+q}h1v1h-1z`;
    return`<svg viewBox="0 0 ${n+q*2} ${n+q*2}" shape-rendering="crispEdges"><rect width="100%" height="100%" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
  }
  return{matrix,svg};
})();

/* =====================================================================
   АДРЕС ДЛЯ ПОДКЛЮЧЕНИЯ ДРУГИХ УСТРОЙСТВ
   ===================================================================== */
let lanInfo=null;
function loadLan(){
  if(lanInfo)return Promise.resolve(lanInfo);
  let url;
  if(IN_APP){const a=$('addr').value.trim().replace(/^\w+:\/\//,'');if(!a)return Promise.resolve(null);url='http://'+a+'/info'}
  else if(location.protocol.startsWith('http'))url='/info';
  else return Promise.resolve(null);
  return fetch(url,{cache:'no-store'}).then(r=>r.json()).then(j=>lanInfo=j).catch(()=>null);
}
function renderLan(){
  loadLan().then(info=>{
    for(const id of['lanOnline','lanLobby']){
      const el=$(id);
      if(!info||!info.ips||!info.ips.length){el.innerHTML='';continue}
      const urls=info.ips.map(a=>`http://${a.address}:${info.port}`),main=urls[0],hs=info.ips[0].hotspot;
      el.innerHTML=`<div class="qr">${QR.svg(main)}</div><div><b>Подключить телефон или другой компьютер</b><br>`+
        `${hs?'Подключитесь к точке доступа этого компьютера':'Подключитесь к той же сети Wi-Fi (или точке доступа)'}, наведите камеру на код или откройте:<br>`+
        `<span class="url">${esc(main)}</span>`+(urls.length>1?`<br><small>Другие адреса: ${urls.slice(1).map(esc).join(', ')}</small>`:'')+`</div>`;
    }
  });
}


/* =====================================================================
   ПРИЛОЖЕНИЕ SprintGames: установка на телефон / компьютер
   ===================================================================== */
const ICO={
  dots:'<svg class="ii" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>',
  share:'<svg class="ii" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M8 7l4-4 4 4"/><path d="M6 11H5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-8a1 1 0 0 0-1-1h-1"/></svg>',
  plus:'<svg class="ii" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M12 8v8M8 12h8"/></svg>',
  dl:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5"/><path d="M5 20h14"/></svg>'
};
const isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const isAndroid=/Android/i.test(navigator.userAgent);
const isStandalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
let installEvt=null;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e});
addEventListener('appinstalled',()=>{installEvt=null;closeInstall()});
if('serviceWorker' in navigator&&window.isSecureContext&&location.protocol.startsWith('http'))navigator.serviceWorker.register('/sw.js').catch(()=>{});

function installSteps(){
  if(isIOS)return`<ol class="steps">
      <li>Откройте эту страницу в <b>Safari</b>.</li>
      <li>Нажмите кнопку <b>«Поделиться»</b> ${ICO.share} внизу экрана.</li>
      <li>Выберите <b>«На экран Домой»</b> ${ICO.plus} и нажмите <b>«Добавить»</b>.</li></ol>`;
  return`<ol class="steps">
      <li>Откройте эту страницу в <b>Chrome</b>.</li>
      <li>Нажмите меню ${ICO.dots} в правом верхнем углу.</li>
      <li>Выберите <b>«Установить приложение»</b> или <b>«Добавить на главный экран»</b>, затем <b>«Установить»</b>.</li></ol>`;
}
function openInstall(){
  if(installEvt&&!isAndroid){
    const e=installEvt;installEvt=null;
    e.prompt();e.userChoice.then(c=>{if(c.outcome!=='accepted')installEvt=e}).catch(()=>{});
    return;
  }
  const box=$('installContent');
  const apkBtn=`<a class="big apk" href="/SprintGames.apk" download="SprintGames.apk">${ICO.dl}Скачать SprintGames.apk</a>`;
  const apkSteps=`<ol class="steps">
      <li>Нажмите <b>«Скачать SprintGames.apk»</b>.</li>
      <li>Откройте скачанный файл (шторка уведомлений или «Загрузки»).</li>
      <li>Если телефон спросит — разрешите установку из этого браузера, затем нажмите <b>«Установить»</b>.</li></ol>`;
  const head=`<div class="ihead"><img src="/icons/icon-192.png" alt="" onerror="this.style.display='none'"><div><div class="iname">SprintGames</div><div class="isub">4 мини-игры · с ботом и с друзьями</div></div></div>`;
  if(isTouch&&isAndroid){
    box.innerHTML=head+`<p>Настоящее приложение для Android: во весь экран, со своей иконкой, игра с ботом работает даже без сети.</p>`+apkBtn+apkSteps+
      `<p class="note">Онлайн-игра с друзьями: приложение само найдёт сервер, если телефон в той же сети Wi-Fi или точке доступа.</p>`;
    $('installBox').classList.remove('hidden');
  }else if(isTouch){
    box.innerHTML=head+`<p>Приложение появится на главном экране телефона со своей иконкой:</p>`+installSteps()+
      `<p class="note">Онлайн-игра с друзьями работает, когда телефон подключён к той же сети, что и компьютер с сервером.</p>`;
    $('installBox').classList.remove('hidden');
  }else{
    const isWin=/Windows/i.test(navigator.userAgent);
    box.innerHTML=head+(isWin?`<p><b>Для этого компьютера</b> — программа SprintGames для Windows: своё окно, ярлык на рабочем столе, а если в сети нет сервера — программа сама станет сервером.</p>`+
      `<a class="big apk" href="/SprintGames-Setup.exe" download="SprintGames-Setup.exe">${ICO.dl}Скачать для Windows</a>`+
      `<p class="note">Если Windows покажет «Windows защитил ваш компьютер» — нажмите «Подробнее» → «Выполнить в любом случае» (программа не подписана платным сертификатом).</p>`:'')+
      `<p><b>Для телефона:</b></p><div class="lan" id="lanInstall"></div>`+
      `<p><b>На Android</b> — после открытия страницы нажмите в меню <b>«Скачать приложение»</b> и установите SprintGames.apk.</p>`+
      `<p><b>На iPhone</b> — откройте страницу в Safari, нажмите «Поделиться» ${ICO.share} и выберите «На экран Домой».</p>`;
    $('installBox').classList.remove('hidden');
    loadLan().then(info=>{
      const el=$('lanInstall');if(!el)return;
      if(!info||!info.ips||!info.ips.length){el.outerHTML='<p class="note">Запустите сервер и откройте игру по адресу сети, чтобы появился QR-код для телефона.</p>';return}
      const url=`http://${info.ips[0].address}:${info.port}`;
      el.innerHTML=`<div class="qr">${QR.svg(url)}</div><div>Подключите телефон к той же сети Wi-Fi (или точке доступа), наведите камеру на код или откройте:<br><span class="url">${esc(url)}</span></div>`;
    });
  }
}
function closeInstall(){$('installBox').classList.add('hidden')}
window.appBack=function(){
  if(!$('installBox').classList.contains('hidden')){closeInstall();return true}
  if(state==='play'){setState('pause');return true}
  if(state==='pause'){setState('play');return true}
  if(state==='online'){setState('menu');return true}
  if(state==='lobby'){netLeave();setState('online');return true}
  if(state==='over'){if(Net.online){netLeave();setState('online')}else setState('menu');return true}
  return false;
};
$('installBtn').innerHTML=ICO.dl+'Скачать приложение';
$('installBtn').onclick=openInstall;
$('installClose').onclick=closeInstall;
$('installBox').addEventListener('pointerdown',e=>{if(e.target.id==='installBox')closeInstall()});
if(isStandalone||IN_APP)$('installBtn').style.display='none';

setState('menu');
requestAnimationFrame(loop);
</script>
